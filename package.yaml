name:                ipl-sat
version:             0.1.0.0
github:              "githubuser/ipl-sat"
license:             BSD-3-Clause
author:              "Author name here"
maintainer:          "example@example.com"
copyright:           "2026 Author name here"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/githubuser/ipl-sat#readme>

dependencies:
- base >= 4.7 && < 5

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  ipl-sat-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - ipl-sat
    
  convert-iltp:
    main:                ConvertILTP.hs
    source-dirs:         scripts
    dependencies:
    - ipl-sat
    - directory
    - filepath
    - mtl

  prover-bench:
    main:                Main.hs
    source-dirs:         prover-bench
    dependencies:
    - ipl-sat
    - free-foil
    - g4ip-prover
    - rzk
    - yaml
    - mtl
    - aeson
    - text
    - vector
    - directory
    - filepath

tests:
  ipl-sat-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - ipl-sat
    - hspec
    - directory
    - filepath
    - yaml
    - aeson
    - process
    - text
